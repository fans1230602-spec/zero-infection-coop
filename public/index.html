<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>末日：零号感染｜双人生存</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Microsoft Yahei',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#e8edf4;background-image:radial-gradient(circle at 80% 0%,#243043 0,transparent 38%)}main{max-width:760px;margin:auto;padding:22px 15px 70px}h1{font-size:27px;margin:7px 0}h2{font-size:18px;margin:0 0 13px}p{color:#a8b5c7;line-height:1.65}.eyebrow{font-size:12px;color:#f38d83;letter-spacing:2px}.panel{background:#151e2b;border:1px solid #303b4c;border-radius:15px;padding:17px;margin:14px 0;box-shadow:0 8px 24px #0002}.muted{color:#9eacc0;font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#202b39;border-radius:10px;padding:11px}.stat b{display:block;font-size:19px;margin-top:5px}input{background:#0c1420;border:1px solid #445169;color:white;border-radius:9px;padding:13px;width:100%;font-size:16px}button{border:1px solid #52637b;background:#26364b;color:white;border-radius:10px;padding:12px 13px;font-weight:650;cursor:pointer;font-size:14px}button.primary{background:#c84c45;border-color:#c84c45}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.actions button{text-align:left;min-height:55px}.pill{background:#334155;border-radius:50px;padding:5px 10px;font-size:12px}.log{height:240px;overflow-y:auto;background:#0c1420;border-radius:10px;padding:12px}.entry{padding:9px 0;border-bottom:1px solid #263241;font-size:14px;line-height:1.5}.entry small{color:#e99a8b;margin-right:7px}.hidden{display:none!important}.warning{color:#f5a79d}.player{border:1px solid #34465b;border-radius:10px;padding:10px}.player.me{border-color:#b76459}.inventory{line-height:2;color:#b9c7d7}.footer{font-size:12px;color:#78879b;margin-top:20px}</style></head><body><main><div class="eyebrow">CO-OP SURVIVAL · ONLINE</div><h1>末日：零号感染</h1><p>第1章：灾变之夜。17楼已经沦陷，你们必须合作生存。</p><section id="lobby" class="panel"><h2>创建或加入房间</h2><p>两个人各用一台手机打开本网页，一人创建房间，另一人输入房间码。</p><input id="name" maxlength="16" placeholder="你的幸存者昵称" value="幸存者"><div class="row" style="margin-top:12px"><button class="primary" id="create">创建双人房间</button></div><hr style="border:0;border-top:1px solid #344155;margin:20px 0"><input id="code" maxlength="6" placeholder="输入6位房间码" style="text-transform:uppercase"><button id="join" style="margin-top:10px">加入朋友的房间</button></section><section id="game" class="hidden"><div class="panel"><div class="row"><span>房间码：<strong id="roomCode"></strong></span><button id="copy">复制邀请信息</button></div><p class="muted">将网址和房间码发给朋友。双方进入同一房间后实时同步。</p><div id="players" class="grid"></div></div><div class="panel"><div class="row"><h2>当前场景</h2><span class="pill" id="turn"></span></div><p id="scene"></p><div id="enemy" class="warning"></div><p id="door" class="muted"></p></div><div class="panel"><h2>行动选择</h2><div id="actions" class="actions"></div></div><div class="panel"><h2>背包与基地储备</h2><div class="muted">我的背包</div><div id="inventory" class="inventory"></div><div class="muted">1703基地库存</div><div id="supplies" class="inventory"></div></div><div class="panel"><h2>实时事件与队伍聊天</h2><div id="log" class="log" aria-live="polite"></div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="chat" maxlength="160" placeholder="给队友发消息"><button id="send">发送</button></div></div></section><div id="status" class="footer">尚未连接</div></main><script>
const $=id=>document.getElementById(id);let ws,room,me,code,playerId;const stored=()=>{try{return JSON.parse(localStorage.getItem('zi_session')||'{}')}catch{return {}}};const sess=stored();if(sess.code)$('code').value=sess.code;if(sess.name)$('name').value=sess.name;
function status(t){$('status').textContent=t}function socket(cb){if(ws&&ws.readyState===1){cb();return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{status('已连接服务器');cb()};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){status('提示：'+m.message);alert(m.message)}if(m.type==='joined'){playerId=m.playerId;code=m.roomCode;localStorage.setItem('zi_session',JSON.stringify({code,playerId,name:$('name').value}));$('lobby').classList.add('hidden');$('game').classList.remove('hidden')}if(m.type==='state'){room=m.room;render()}};ws.onclose=()=>{status('连接已断开，正在尝试重连…');setTimeout(()=>{const s=stored();if(s.code)socket(()=>send({type:'join',code:s.code,name:s.name,playerId:s.playerId}))},2000)};ws.onerror=()=>status('连接失败，请检查网络或服务器')}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x));else status('尚未连接服务器')}function start(type){socket(()=>send({type,code:$('code').value.trim().toUpperCase(),name:$('name').value.trim()||'幸存者',playerId:type==='join'&&stored().code===$('code').value.trim().toUpperCase()?stored().playerId:undefined}))}$('create').onclick=()=>start('create');$('join').onclick=()=>start('join');$('copy').onclick=async()=>{const s=`来玩《末日：零号感染》！\n网址：${location.href}\n房间码：${code}`;try{await navigator.clipboard.writeText(s);status('邀请信息已复制')}catch{prompt('复制邀请信息',s)}};
function render(){if(!room)return;me=room.players.find(p=>p.id===playerId);$('roomCode').textContent=room.code;$('turn').textContent='行动回合 '+room.turn;$('players').replaceChildren();room.players.forEach(p=>{let el=document.createElement('div');el.className='player'+(p.id===playerId?' me':'');el.textContent=`${p.name}${p.id===playerId?'（你）':''} ${p.connected?'🟢':'⚪'}\n❤️ ${p.hp}/100 · ⚡ ${p.stamina}/100\n📍 ${p.location}`;el.style.whiteSpace='pre-line';$('players').append(el)});$('scene').textContent=me?.location==='1703安全屋'?'你身处1703公寓。物资储存在这里，门外可能有危险。':me?.location==='17楼走廊'?'楼道灯光昏暗，1704的门敞开，1706的幸存者正在等待救援。':me?.location==='1704室'?'1704室内一片狼藉，远处有异响。':'1706室内，护士林雨晴紧张地望着你。';$('enemy').textContent=room.enemyAlive?'⚠️ 走廊感染者：'+room.enemyHP+'/60 HP':'✓ 走廊感染者已被击倒';$('door').textContent='1703防盗门：'+(room.doorLocked?'已反锁':'已解锁');const choices=[['🔍 搜索基地物资','search'],['🛌 休息','rest'],['💧 喝水','drink'],['🩹 使用急救包','heal'],['🔓 解锁防盗门','unlock'],['🔒 反锁防盗门','lock'],['⚔️ 攻击感染者','attack'],['👁️ 观察环境','inspect'],...['1703安全屋','17楼走廊','1704室','1706室'].map(l=>['📍 前往 '+l,'go:'+l])];$('actions').replaceChildren();choices.forEach(([label,a])=>{let b=document.createElement('button');b.textContent=label;b.disabled=!me||me.hp<=0;b.onclick=()=>send({type:'action',action:a});$('actions').append(b)});$('inventory').textContent=Object.entries(me?.inventory||{}).filter(([,n])=>n>0).map(([k,n])=>`${k} ×${n}`).join(' · ')||'空';$('supplies').textContent=Object.entries(room.supplies).filter(([,n])=>n>0).map(([k,n])=>`${k} ×${n}`).join(' · ')||'已搜空';const log=$('log');log.replaceChildren();room.log.forEach(e=>{let d=document.createElement('div'),s=document.createElement('small');d.className='entry';s.textContent=e.t;d.append(s,document.createTextNode(e.msg));log.append(d)});log.scrollTop=log.scrollHeight;status('实时同步中 · '+room.players.filter(p=>p.connected).length+'/2 在线')}
function chat(){const t=$('chat').value.trim();if(t){send({type:'chat',message:t});$('chat').value=''}}$('send').onclick=chat;$('chat').addEventListener('keydown',e=>{if(e.key==='Enter')chat()});if(sess.code)socket(()=>send({type:'join',code:sess.code,name:sess.name,playerId:sess.playerId}));
</script></body></html>
